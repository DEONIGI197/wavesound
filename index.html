<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WaveSound | Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
    :root {
        --brand-green: #39FF14; /* Кислотный зеленый */
        --bg-deep: #050505;
        --card-bg: rgba(255, 255, 255, 0.03);
        --glass-stroke: rgba(255, 255, 255, 0.08);
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-deep);
        color: white;
        margin: 0;
        overflow: hidden;
        /* Тот самый градиент со скринов */
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(57, 255, 20, 0.05) 0%, transparent 40%),
            radial-gradient(circle at 90% 80%, rgba(57, 255, 20, 0.03) 0%, transparent 40%);
    }

    /* Эффект стекла для карточек */
    .glass-morphism {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--glass-stroke);
        border-radius: 28px;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .glass-morphism:active {
        transform: scale(0.98);
        background: rgba(255, 255, 255, 0.07);
    }

    /* Моя волна - "Взрыв" цвета */
    .wave-hero {
        position: relative;
        height: 300px;
        border-radius: 40px;
        background: linear-gradient(180deg, rgba(57, 255, 20, 0.2) 0%, rgba(0,0,0,0) 100%);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .wave-glow {
        position: absolute;
        width: 200px;
        height: 200px;
        background: var(--brand-green);
        filter: blur(80px);
        opacity: 0.3;
        animation: pulseGlow 4s infinite alternate;
    }

    @keyframes pulseGlow {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.5); opacity: 0.4; }
    }

    /* Навигация как в Яндексе */
    .nav-tab-active {
        color: var(--brand-green) !important;
        position: relative;
    }

    .nav-tab-active::after {
        content: '';
        position: absolute;
        bottom: -5px;
        width: 4px;
        height: 4px;
        background: var(--brand-green);
        border-radius: 50%;
    }

    /* Кастомный ползунок времени */
    .progress-track {
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        position: relative;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        background: var(--brand-green);
        box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        width: 0%;
        transition: width 0.1s linear;
    }

    /* Анимация появления контента */
    .fade-in {
        animation: fadeInUp 0.6s ease-out forwards;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="safe-area">
        <header class="px-6 pt-4 pb-2 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-brand-green rounded-lg flex items-center justify-center shadow-[0_0_15px_rgba(57,255,20,0.5)]">
                    <svg class="w-5 h-5 fill-black" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                </div>
                <h1 class="text-xl font-800 tracking-tighter">WAVE<span class="text-neutral-500">SOUND</span></h1>
            </div>
            <div class="flex gap-4">
                <button class="opacity-70"><svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
                <div class="w-8 h-8 rounded-full border border-white/20 bg-center bg-cover" style="background-image: url('https://api.dicebear.com/7.x/avataaars/svg?seed=Felix')"></div>
            </div>
        </header>

        <main id="home-page" class="scroll-section">
            <div class="flex gap-3 mb-6">
                <button class="px-5 py-2 rounded-full bg-white text-black font-bold text-sm">Для вас</button>
                <button class="px-5 py-2 rounded-full bg-white/10 text-white font-bold text-sm">Тренды</button>
            </div>

            <section class="my-wave-box rounded-[32px] p-8 mb-8 flex flex-col items-center justify-center text-center">
                <div class="wave-anim"></div>
                <div class="relative z-10">
                    <h2 class="text-4xl font-800 mb-2">Моя волна</h2>
                    <p class="text-neutral-400 text-sm mb-6 uppercase tracking-widest">Музыка под настроение</p>
                    <button onclick="togglePlay()" id="hero-play-btn" class="w-20 h-20 bg-brand-green rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(57,255,20,0.4)] active:scale-90 transition">
                        <svg id="play-icon-main" class="w-10 h-10 fill-black translate-x-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                </div>
            </section>

            <h3 class="text-xl font-bold mb-4">Рекомендуем</h3>
            <div class="grid grid-cols-2 gap-4 mb-10">
                <div class="glass-card p-3 active:scale-95 transition" onclick="loadTrack(0)">
                    <img src="https://avatars.yandex.net/get-music-content/11499252/78419616.a.29415664-1/200x200" class="w-full aspect-square rounded-xl mb-3 shadow-lg">
                    <p class="font-bold text-sm truncate">Feel It</p>
                    <p class="text-xs text-neutral-500">d4vd</p>
                </div>
                <div class="glass-card p-3 active:scale-95 transition" onclick="loadTrack(1)">
                    <img src="https://avatars.yandex.net/get-music-content/6300486/492b4505.a.21639316-1/200x200" class="w-full aspect-square rounded-xl mb-3 shadow-lg">
                    <p class="font-bold text-sm truncate">Starboy</p>
                    <p class="text-xs text-neutral-500">The Weeknd</p>
                </div>
            </div>
        </main>

        <div id="player-bar" class="px-4 pb-2">
            <div class="glass-card p-3 flex flex-col gap-2 shadow-2xl">
                <div class="flex items-center">
                    <img id="player-img" src="https://avatars.yandex.net/get-music-content/11499252/78419616.a.29415664-1/50x50" class="w-12 h-12 rounded-lg mr-3 shadow-md">
                    <div class="flex-1 overflow-hidden">
                        <p id="player-title" class="font-bold text-sm truncate">Название песни</p>
                        <p id="player-artist" class="text-xs text-neutral-400 truncate">Исполнитель</p>
                    </div>
                    <div class="flex items-center gap-5 px-2">
                        <button onclick="toggleLike()" id="like-btn"><svg class="w-6 h-6 fill-neutral-500 transition" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5 22 12.28 18.6 15.36 13.45 20.03L12 21.35z"/></svg></button>
                        <button onclick="togglePlay()" class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
                            <svg id="play-icon-bar" class="w-6 h-6 fill-black translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-3 px-1">
                    <span id="time-current" class="text-[10px] text-neutral-500 w-8">0:00</span>
                    <div id="progress-container" onclick="seek(event)">
                        <div id="progress-bar"></div>
                    </div>
                    <span id="time-total" class="text-[10px] text-neutral-500 w-8 text-right">0:00</span>
                </div>
            </div>
        </div>

        <nav class="flex justify-around items-center h-16 bg-black/80 backdrop-blur-md border-t border-white/5">
            <button class="nav-item active"><svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="text-[10px] mt-1 font-bold">Главная</span></button>
            <button class="nav-item"><svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M12 10.9c-.61 0-1.1.49-1.1 1.1s.49 1.1 1.1 1.1 1.1-.49 1.1-1.1-.49-1.1-1.1-1.1zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg><span class="text-[10px] mt-1 font-bold">Обзор</span></button>
            <button class="nav-item"><svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg><span class="text-[10px] mt-1 font-bold">Коллекция</span></button>
        </nav>
    </div>

    <audio id="main-audio" src=""></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.backgroundColor = '#080808';
        tg.headerColor = '#080808';

        const tracks = [
            { title: "Feel It", artist: "d4vd", img: "https://avatars.yandex.net/get-music-content/11499252/78419616.a.29415664-1/200x200", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { title: "Starboy", artist: "The Weeknd", img: "https://avatars.yandex.net/get-music-content/6300486/492b4505.a.21639316-1/200x200", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('main-audio');
        const playIconMain = document.getElementById('play-icon-main');
        const playIconBar = document.getElementById('play-icon-bar');
        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function loadTrack(index) {
            const track = tracks[index];
            currentTrackIndex = index;
            audio.src = track.url;
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.artist;
            document.getElementById('player-img').src = track.img;
            
            togglePlay(true);
            tg.HapticFeedback.impactOccurred('light');
        }

        function togglePlay(forcePlay = false) {
            const isPlaying = !audio.paused;
            const pauseSVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            const playSVG = '<path d="M8 5v14l11-7z"/>';

            if (isPlaying && !forcePlay) {
                audio.pause();
                playIconMain.innerHTML = playSVG;
                playIconBar.innerHTML = playSVG;
            } else {
                audio.play();
                playIconMain.innerHTML = pauseSVG;
                playIconBar.innerHTML = pauseSVG;
            }
        }

        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            timeCurrent.innerText = formatTime(audio.currentTime);
            timeTotal.innerText = formatTime(audio.duration || 0);
        };

        function formatTime(seconds) {
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0'+sec : sec}`;
        }

        function seek(e) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        }

        function toggleLike() {
            const btn = document.getElementById('like-btn').querySelector('svg');
            btn.style.fill = btn.style.fill === 'rgb(57, 255, 20)' ? '#555' : '#39FF14';
            tg.HapticFeedback.notificationOccurred('success');
        }

        // Инициализация первого трека без автоплея
        window.onload = () => loadTrack(0); audio.pause();
    </script>
</body>
</html>
