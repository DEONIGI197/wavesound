<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WaveSound | Оставайся на волне</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: white;
            padding-top: env(safe-area-inset-top);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Стилизация табов "Для вас" / "Тренды" */
        .chip-active {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        /* Градиент "Моей волны" как на скрине */
        .wave-glow {
            background: radial-gradient(circle, rgba(34, 197, 94, 0.4) 0%, rgba(0,0,0,0) 70%);
        }

        /* Скрываем скроллбар */
        ::-webkit-scrollbar { display: none; }

        /* Иконки внизу: центрирование */
        .nav-icon { width: 26px; height: 26px; fill: none; stroke: #8E8E93; stroke-width: 1.5; }
        .nav-item.active .nav-icon { stroke: #FFFFFF; }
        .nav-item.active span { color: #FFFFFF; }

        /* Плеер */
        .player-blur {
            background: rgba(28, 28, 28, 0.9);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="pb-32">

    <header class="flex items-center justify-between px-4 py-3 sticky top-0 bg-black z-50">
        <div class="flex gap-4">
            <span class="text-[17px] font-semibold chip-active px-3 py-1">Для вас</span>
            <span class="text-[17px] font-semibold text-neutral-500 px-3 py-1">Тренды</span>
        </div>
        <svg class="w-6 h-6 stroke-white fill-none" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round"/></svg>
    </header>

    <section class="relative px-4 py-8 flex flex-col items-center justify-center min-h-[300px]">
        <div class="absolute inset-0 wave-glow animate-pulse"></div>
        <div class="relative z-10 text-center">
            <div class="flex items-center justify-center gap-3 mb-4">
                <svg class="w-10 h-10 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <h2 class="text-4xl font-bold tracking-tight">Моя волна</h2>
            </div>
            <button class="bg-white/10 backdrop-blur-md border border-white/10 px-6 py-2 rounded-full flex items-center gap-2 mx-auto active:scale-95 transition">
                <svg class="w-4 h-4 stroke-white fill-none" viewBox="0 0 24 24"><path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" stroke-width="2" stroke-linecap="round"/></svg>
                <span class="text-sm font-medium">Настроить</span>
            </button>
        </div>
    </section>

    <section class="px-4 grid grid-cols-2 gap-3 mb-8">
        <div class="bg-neutral-900/50 p-3 rounded-2xl flex items-center gap-3">
            <div class="w-12 h-12 bg-gradient-to-br from-green-600 to-green-900 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5 22 12.28 18.6 15.36 13.45 20.03L12 21.35z"/></svg>
            </div>
            <div>
                <p class="text-[14px] font-bold">Мне нравится</p>
                <p class="text-[12px] text-neutral-500">814 треков</p>
            </div>
        </div>
        <div class="bg-neutral-900/50 p-3 rounded-2xl flex items-center gap-3">
            <img src="https://avatars.yandex.net/get-music-content/9831720/190f7d54.a.27649581-1/50x50" class="w-12 h-12 rounded-lg">
            <div>
                <p class="text-[14px] font-bold">История</p>
                <p class="text-[12px] text-neutral-500">stel11a, madk1d</p>
            </div>
        </div>
    </section>

    <section class="px-4 mb-8">
        <h3 class="text-[20px] font-bold mb-4">Артист рекомендует</h3>
        <div class="relative rounded-3xl overflow-hidden bg-neutral-900 aspect-[4/3]">
            <img src="https://images.unsplash.com/photo-1493225255756-d9584f8606e9?auto=format&fit=crop&w=800&q=80" class="absolute inset-0 w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
            <div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                <div>
                    <h4 class="text-xl font-bold">Моряки</h4>
                    <p class="text-sm text-neutral-300">Mag Luzi, REMINI</p>
                </div>
                <button class="bg-white text-black px-4 py-2 rounded-full flex items-center gap-2 font-bold active:scale-90 transition">
                    <svg class="w-4 h-4 fill-black" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Слушать
                </button>
            </div>
        </div>
    </section>

    <div class="fixed bottom-[84px] left-2 right-2 z-50">
        <div class="player-blur border border-white/5 rounded-2xl p-2 flex items-center">
            <img src="https://avatars.yandex.net/get-music-content/11499252/78419616.a.29415664-1/50x50" class="w-12 h-12 rounded-xl mr-3 shadow-lg shadow-black/50">
            <div class="flex-1 min-w-0">
                <p class="text-[14px] font-bold truncate">Необычно x Brazil</p>
                <p class="text-[12px] text-neutral-400 truncate">Сестры Каратыгины, LXSTFAI...</p>
            </div>
            <div class="flex items-center gap-5 px-3">
                <svg class="w-6 h-6 stroke-white fill-none" viewBox="0 0 24 24" stroke-width="2"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                <svg class="w-7 h-7 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 backdrop-blur-lg border-t border-white/5 h-20 flex justify-around items-center px-2 pb-2">
        <div class="nav-item active flex flex-col items-center gap-1">
            <svg class="nav-icon"><path d="M9 19V6l12-3v13M9 10c0-1.105-1.12-2-2.5-2S4 8.895 4 10s1.12 2 2.5 2 2.5-.895 2.5-2zm12-3c0-1.105-1.12-2-2.5-2S16 5.895 16 7s1.12 2 2.5 2 2.5-.895 2.5-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="nav-item flex flex-col items-center gap-1">
            <svg class="nav-icon"><path d="M4 11a1 1 0 011-1h1a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zm7-4a1 1 0 011-1h1a1 1 0 011 1v10a1 1 0 01-1 1h-1a1 1 0 01-1-1V7zm7 8a1 1 0 011-1h1a1 1 0 011 1v2a1 1 0 01-1 1h-1a1 1 0 01-1-1v-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="nav-item flex flex-col items-center gap-1">
            <svg class="nav-icon"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="nav-item flex flex-col items-center gap-1">
            <svg class="nav-icon"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000';
        tg.backgroundColor = '#000000';

        // Вибрация при тапах
        document.querySelectorAll('button, .nav-item').forEach(el => {
            el.addEventListener('click', () => {
                tg.HapticFeedback.impactOccurred('light');
            });
        });
    </script>
</body>
</html>
