<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WaveSound</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0D0D0D;
            color: white;
            overflow-x: hidden;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
            border: 1px solid rgba(57, 255, 20, 0.5);
        }
        .neon-text {
            color: #39FF14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
        }
        .nav-bar {
            background: rgba(13, 13, 13, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Анимация волны */
        .wave-bar {
            width: 4px;
            background: #39FF14;
            margin: 0 2px;
            border-radius: 10px;
            animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { height: 10px; }
            50% { height: 40px; }
        }
    </style>
</head>
<body class="pb-24">

    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-800 tracking-tighter italic">WAVE<span class="neon-text">SOUND</span></h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest">Оставайся на волне</p>
        </div>
        <div class="w-10 h-10 rounded-full neon-border overflow-hidden">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profile">
        </div>
    </header>

    <section class="px-6 mb-8">
        <div class="glass-card p-8 flex flex-col items-center justify-center relative overflow-hidden h-64">
            <div class="flex items-end justify-center h-20 mb-4" id="wave-container">
                </div>
            <div class="text-center z-10">
                <h2 class="text-xl font-bold" id="track-title">Blinding Lights</h2>
                <p class="text-gray-400 text-sm" id="artist-name">The Weeknd</p>
            </div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-green-500 opacity-10 blur-3xl"></div>
        </div>
    </section>

    <section class="px-6 mb-10">
        <div class="flex justify-between items-center mb-6">
            <button class="text-gray-400">🔀</button>
            <button class="text-2xl">⏮</button>
            <button class="w-16 h-16 bg-[#39FF14] rounded-full flex items-center justify-center text-black text-3xl shadow-lg shadow-green-500/40">▶</button>
            <button class="text-2xl">⏭</button>
            <button class="text-gray-400">🔁</button>
        </div>
        <div class="w-full bg-gray-800 h-1 rounded-full overflow-hidden">
            <div class="bg-[#39FF14] h-full w-1/3"></div>
        </div>
    </section>

    <section class="px-6">
        <h3 class="text-lg font-bold mb-4">Тренды недели</h3>
        <div class="space-y-4">
            <div class="flex items-center glass-card p-3">
                <img src="https://i.scdn.co/image/ab67616d0000b27370ad9f661c479342465c1752" class="w-12 h-12 rounded-lg mr-4">
                <div class="flex-1">
                    <p class="font-semibold text-sm">Starboy</p>
                    <p class="text-xs text-gray-500">The Weeknd</p>
                </div>
                <button class="text-[#39FF14]">❤</button>
            </div>
            <div class="flex items-center glass-card p-3">
                <img src="https://i.scdn.co/image/ab67616d0000b273204787fa5417036496942c4c" class="w-12 h-12 rounded-lg mr-4">
                <div class="flex-1">
                    <p class="font-semibold text-sm">After Dark</p>
                    <p class="text-xs text-gray-500">Mr.Kitty</p>
                </div>
                <button class="text-gray-500">❤</button>
            </div>
        </div>
    </section>

    <nav class="fixed bottom-0 left-0 right-0 nav-bar flex justify-around p-4 z-50">
        <button class="neon-text flex flex-col items-center">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] mt-1">Главная</span>
        </button>
        <button class="text-gray-500 flex flex-col items-center">
            <span class="text-xl">📊</span>
            <span class="text-[10px] mt-1">Чарты</span>
        </button>
        <button class="text-gray-500 flex flex-col items-center">
            <span class="text-xl">🎚</span>
            <span class="text-[10px] mt-1">Эквалайзер</span>
        </button>
        <button class="text-gray-500 flex flex-col items-center">
            <span class="text-xl">👤</span>
            <span class="text-[10px] mt-1">Профиль</span>
        </button>
    </nav>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0D0D0D';

        // Генерация волны
        const waveContainer = document.getElementById('wave-container');
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';
            bar.style.animationDelay = `${i * 0.05}s`;
            waveContainer.appendChild(bar);
        }
    </script>
</body>
</html>
