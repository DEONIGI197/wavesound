<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WaveSound | Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #39FF14;
            --bg: #000000;
            --card: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.1);
            --text-sec: #8E8E93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg); color: white; overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1a331a 0%, transparent 60%);
        }

        /* Layout */
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; overflow-y: auto; padding: 20px 20px 180px 20px; display: none; }
        .content.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Header */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 22px; letter-spacing: -1px; }
        .logo span { color: var(--brand); }

        /* "Моя Волна" Card */
        .hero-wave {
            height: 280px; border-radius: 35px; margin-bottom: 30px;
            background: linear-gradient(135deg, #0a0a0a 0%, #000 100%);
            border: 1px solid var(--border); position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .wave-blob {
            position: absolute; width: 200px; height: 200px; background: var(--brand);
            filter: blur(70px); opacity: 0.15; animation: pulse 5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.6); } }

        .play-btn-big {
            width: 75px; height: 75px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 2; transition: 0.2s;
        }
        .play-btn-big:active { transform: scale(0.9); }

        /* Tracks List */
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .track-card {
            display: flex; align-items: center; background: var(--card);
            padding: 12px; border-radius: 20px; margin-bottom: 12px;
            border: 1px solid var(--border); transition: 0.2s;
        }
        .track-card:active { background: rgba(255,255,255,0.1); }
        .track-img { width: 55px; height: 55px; border-radius: 12px; margin-right: 15px; object-fit: cover; }
        .track-info { flex: 1; }
        .track-name { font-weight: 700; font-size: 15px; margin: 0; }
        .track-artist { color: var(--text-sec); font-size: 12px; margin: 5px 0 0 0; }

        /* Floating Player */
        .mini-player {
            position: fixed; bottom: 85px; left: 15px; right: 15px;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px); border-radius: 24px;
            padding: 12px; border: 1px solid var(--border);
            display: flex; align-items: center; z-index: 100;
        }
        .p-progress {
            position: absolute; top: 0; left: 15px; right: 15px; height: 2px;
            background: rgba(255,255,255,0.1);
        }
        .p-bar { height: 100%; background: var(--brand); width: 0%; box-shadow: 0 0 10px var(--brand); }

        /* Nav Bar */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: #000; border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px;
        }
        .nav-link { color: var(--text-sec); text-align: center; text-decoration: none; font-size: 10px; font-weight: 600; }
        .nav-link.active { color: var(--brand); }
        .nav-link svg { width: 24px; height: 24px; display: block; margin: 0 auto 4px; fill: currentColor; }

        /* EQ Styles */
        .eq-row { margin-bottom: 25px; }
        input[type=range] { width: 100%; accent-color: var(--brand); margin-top: 10px; }

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">WAVE<span>SOUND</span></div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </header>

    <div id="page-home" class="content active">
        <div class="hero-wave">
            <div class="wave-blob"></div>
            <div style="z-index: 2; text-align: center; margin-bottom: 20px;">
                <p style="color: var(--brand); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;">Персональный AI микс</p>
                <h2 style="margin: 5px 0; font-size: 32px;">Моя волна</h2>
            </div>
            <div class="play-btn-big" onclick="togglePlay()">
                <svg
